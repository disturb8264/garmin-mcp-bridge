services:
  garmin:
    image: ${GARMIN_IMAGE:-disturb8264/garmin-mcp-bridge:0.3.1}
    pull_policy: never
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file: runtime/garmin/.env
    environment:
      GARMIN_TOKEN_DIR: /app/data/tokens
      COLLECTOR_TOKEN_FILE: /run/secrets/collector_internal_token
      COLLECTOR_API_HOST: 127.0.0.1
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8765
      MCP_TOKEN_FILE: /run/secrets/mcp_internal_token
      MCP_COLLECTOR_URL: http://127.0.0.1:8766/collect-range
      MCP_COLLECTOR_TOKEN_FILE: /run/secrets/collector_internal_token
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ./runtime/garmin/data/tokens:/app/data/tokens
      - ./runtime/garmin/data/mcp_internal_token:/run/secrets/mcp_internal_token:ro
      - ./runtime/garmin/data/collector_internal_token:/run/secrets/collector_internal_token:ro
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:${MCP_PORT:-18765}:8765"
    healthcheck:
      test: ["CMD", "python", "-m", "app.combined_healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  gateway:
    image: ${GATEWAY_IMAGE:-mcp-gateway:local}
    pull_policy: never
    container_name: mcp-gateway
    depends_on:
      garmin:
        condition: service_healthy
    network_mode: host
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file: runtime/gateway/.env
    environment:
      GATEWAY_CONFIG: /app/gateway.yaml
      MCP_SERVER_URL: http://127.0.0.1:18767/mcp
      MCP_EXTRA_HEADERS: "X-MCP-Internal-Token: file:/app/secrets/gateway_token"
      MCP_DISCOVERY_EXTRA_HEADERS: "X-MCP-Internal-Token: file:/app/secrets/gateway_token"
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ./runtime/gateway/gateway.yaml:/app/gateway.yaml:ro
      - ./runtime/gateway/secrets:/app/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-m", "gateway.combined_healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    restart: unless-stopped
